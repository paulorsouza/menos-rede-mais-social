# Parâmetros públicos de anúncios e de pagamento a criadores
# (services/ads-engine).
#
# Os valores abaixo são ILUSTRATIVOS. Os números finais dependem de decisão do
# conselho (veja a seção 6 do plano). Qualquer mudança passa por RFC e entra
# no log público antes de valer. Ao mudar, aumente `version`.
version = 3

# Nos shorts, entra um anúncio a cada N shorts assistidos.
shorts_ad_every = 6

[payout]
# Quanto o criador recebe por mil views com anúncio, na primeira faixa, em
# centavos. Com o preço nacional abaixo (R$ 20,00 por mil exibições), quem
# está na primeira faixa fica com 55% do que o anunciante pagou. As faixas
# reduzem essa parte conforme o criador cresce; a diferença vai para o fundo
# ou para criadores pequenos (decisão em aberto, seção 13 do plano).
base_cents_per_thousand = 1100
# Uma view com anúncio regional vale esta porcentagem de uma view com anúncio
# nacional, porque o anúncio regional custa menos para quem anuncia.
regional_view_percent = 50
# Nos shorts, a parte da receita de cada anúncio que vai para os criadores
# do bloco, a mesma dos vídeos. O resto vai para o fundo de infraestrutura.
creator_share_percent = 55
# Como essa parte se divide entre os shorts do bloco: "partes-iguais" (cada
# short com anúncio ligado vale uma parte) ou "tempo-assistido". Partes
# iguais não depende do tempo que o app informa.
shorts_split = "partes-iguais"
# Repasse menor que isto fica para o mês seguinte: um PIX de centavos custa
# mais do que vale. Nada se perde, o saldo só espera.
minimum_payout_cents = 100

[pricing]
# Duração de cada anúncio, em segundos. Junto com as horas por dia que o
# anunciante compra, diz quantas exibições cabem no dia.
ad_seconds = 15
# Preço de cada exibição, em centavos. Igual para todo anunciante: não tem
# leilão nem segmentação por perfil.
national_cents_per_impression = 2
regional_cents_per_impression = 1

[antifraud]
# Para o pagamento, a mesma pessoa conta no máximo esta quantidade de views
# com anúncio por vídeo, por dia...
max_views_per_viewer_post_per_day = 1
# ...e esta quantidade por criador, por dia. O que passa disso fica no
# extrato, como descartado, com o motivo.
max_views_per_viewer_creator_per_day = 10

[delivery]
# Peso de cada hora do dia (hora de Brasília, da 0h às 23h). As exibições
# compradas para o dia saem nesse ritmo, em vez de acabar todas de manhã.
hourly_weights = [2, 1, 1, 1, 1, 2, 4, 6, 7, 7, 7, 7, 8, 8, 7, 7, 7, 8, 9, 10, 10, 9, 6, 4]
# Folga sobre o ritmo, em porcentagem: a campanha pode estar até isto à
# frente do previsto para a hora.
headroom_percent = 10
# Anúncio nacional não pode gastar numa região mais do que a parte dela na
# audiência do dia, com esta folga.
region_headroom_percent = 20

# Faixas de pagamento decrescente, pelo total de views com anúncio do criador
# no mês. Cada faixa vale só para as views dentro dela, como no imposto de
# renda: crescer nunca diminui o ganho total.
# `up_to` é o limite de cima da faixa. A última faixa não tem limite.
# `percent` é quanto do valor base cada view dessa faixa paga.

[[payout_bands]]
up_to = 100_000
percent = 100

[[payout_bands]]
up_to = 1_000_000
percent = 75

[[payout_bands]]
up_to = 10_000_000
percent = 50

[[payout_bands]]
percent = 30
