# Parâmetros públicos do motor de feed (services/feed-engine).
#
# Este arquivo é lido pelo código em produção. Mudar qualquer valor aqui é uma
# mudança de código como outra qualquer: passa por RFC, revisão de duas pessoas
# e entra no log público antes de valer. Ao mudar, aumente `version`.
#
# O feed é um grafo de pessoas e posts. Uma pessoa se liga a um post quando
# curte ou assiste, e a outra pessoa quando segue. Não existe categoria, tema
# nem tag: a rede nunca decide do que um post fala, só olha o que as pessoas
# fazem.
version = 2

[recency]
# A pontuação de recência cai pela metade a cada `half_life_hours` horas.
half_life_hours = 24

[graph]
# Só contam curtidas e vídeos assistidos dos últimos `window_days` dias.
window_days = 90
# Assistir conta quando a pessoa viu pelo menos `watch_min_seconds` segundos.
# Passar direto não liga ninguém a nada.
watch_min_seconds = 10
# Força da ligação entre uma pessoa e um post.
like_weight = 5
watch_weight = 2

[neighbors]
# Vizinhos são pessoas com gosto parecido com o seu. Para ser vizinho, alguém
# precisa ter curtido ou assistido pelo menos `min_shared` posts que você
# também curtiu ou assistiu...
min_shared = 2
# ...e esses posts em comum precisam ser pelo menos `min_overlap_percent` por
# cento de tudo o que essa pessoa curte e assiste. Assim quem curte tudo não
# vira vizinho de todo mundo.
min_overlap_percent = 10
# Quantos vizinhos entram na conta, dos mais parecidos para os menos.
max_neighbors = 200
# Quem você segue sempre é vizinho, com este peso a mais.
follow_weight = 3

[bubble]
# Modo "na bolha": posts de quem você segue e o que seus vizinhos curtem e
# assistem. Pontos por seguir o autor do post.
author_points = 500
# Multiplica curtidas + salvamentos do post.
engagement_weight = 1

[outside_bubble]
# Modo "furando a bolha": posts que ninguém perto de você curtiu ou assistiu,
# de gente que você não segue. Cada autor tem a mesma vez, em rodízio, para
# ninguém ocupar o feed sozinho.
#
# Mínimo de curtidas + salvamentos para um post de fora da bolha entrar.
min_engagement = 10

[mixed]
# Modo "meio a meio": a cada `outside_every` itens, um vem de fora da bolha.
# Com 2, os modos se alternam um a um.
outside_every = 2

[public_ranking]
# Modo "em alta". A fórmula é igual para todo mundo:
# (curtidas × like_weight + salvamentos × save_weight + 1) × recência
like_weight = 1
save_weight = 3
