name: CI

# Cada action fica fixada por hash de commit, como pede a seção de segurança
# do plano: uma tag pode ser movida para outro código, um hash não. O
# comentário diz a versão de cada hash.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Os testes de mídia geram e convertem vídeos de verdade.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  secrets:
    # Procura senhas e chaves que tenham escapado para o histórico.
    # Em organizações do GitHub, a gitleaks-action pede uma licença gratuita
    # (GITLEAKS_LICENSE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproduzivel:
    # Constrói o motor e o verificador com Nix duas vezes. A segunda vez
    # recompila do zero e falha se um único byte do binário mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix build .#engine-server .#verificador
      - run: nix build .#engine-server --rebuild
      - run: sha256sum result*/bin/*

  assinatura:
    # Na main, assina os binários com o Sigstore sem chave guardada: a
    # identidade é a do próprio GitHub Actions, e a assinatura entra no
    # Rekor, o log público do Sigstore. Qualquer pessoa confere com
    #   cosign verify-blob --bundle engine-server.sigstore.json \
    #     --certificate-identity-regexp 'github.com/.*/menos-rede-mais-social' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    #     engine-server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reproduzivel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - run: |
          nix build .#engine-server .#verificador
          mkdir assinados
          cp result/bin/engine-server result-1/bin/verificador assinados/
          cd assinados
          for binario in engine-server verificador; do
            cosign sign-blob --yes --bundle "$binario.sigstore.json" "$binario"
          done
          sha256sum engine-server verificador > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binarios-assinados
          path: assinados/

  dependencias:
    # A lista pública de dependências (SBOM): cada pacote do motor, do
    # backend, do front e da CI, com a versão travada nos arquivos de lock.
    # Sai em SPDX e em CycloneDX, os dois formatos abertos mais usados.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dependencias.spdx.json
          upload-artifact: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dependencias.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lista-de-dependencias
          path: dependencias.*.json
