name: CI

# Pendente: fixar cada action por hash de commit (SHA) em vez de tag, como pede
# a seção de segurança do plano. Tags podem ser movidas; hashes não.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/backend
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      # Os testes de mídia geram e convertem vídeos de verdade.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  secrets:
    # Procura senhas e chaves que tenham escapado para o histórico.
    # Em organizações do GitHub, a gitleaks-action pede uma licença gratuita
    # (GITLEAKS_LICENSE).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reproduzivel:
    # Constrói o motor e o verificador com Nix duas vezes. A segunda vez
    # recompila do zero e falha se um único byte do binário mudar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#engine-server .#verificador
      - run: nix build .#engine-server --rebuild
      - run: sha256sum result*/bin/*

  assinatura:
    # Na main, assina os binários com o Sigstore sem chave guardada: a
    # identidade é a do próprio GitHub Actions, e a assinatura entra no
    # Rekor, o log público do Sigstore. Qualquer pessoa confere com
    #   cosign verify-blob --bundle engine-server.sigstore.json \
    #     --certificate-identity-regexp 'github.com/.*/menos-rede-mais-social' \
    #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
    #     engine-server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reproduzivel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: sigstore/cosign-installer@v3
      - run: |
          nix build .#engine-server .#verificador
          mkdir assinados
          cp result/bin/engine-server result-1/bin/verificador assinados/
          cd assinados
          for binario in engine-server verificador; do
            cosign sign-blob --yes --bundle "$binario.sigstore.json" "$binario"
          done
          sha256sum engine-server verificador > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binarios-assinados
          path: assinados/
